<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>Calculating</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(45,111,177,.22),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #06101a 0%,
            #08131e 55%,
            #091722 100%
        );

    color:#fff;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:400px;
    padding:30px 25px;
    text-align:center;
}

/* ICON */

.icon{
    width:62px;
    height:62px;
    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(52,127,199,.30),
            rgba(38,91,145,.12)
        );

    border:1px solid rgba(77,151,213,.28);

    font-size:27px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.05);
}

/* TITLE */

h1{
    font-size:25px;
    font-weight:600;
    margin-bottom:9px;
}

.subtitle{
    color:#81909e;
    font-size:13px;
    line-height:1.5;
}

/* AMOUNT */

.amount{
    margin-top:35px;

    font-size:38px;
    font-weight:600;
    letter-spacing:-1px;

    color:#fff;
}

.currency{
    color:#4b99d5;
    font-size:20px;
    margin-right:5px;
}

/* CARD */

.card{
    margin-top:27px;
    padding:22px 20px;

    border-radius:19px;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(62,139,207,.14),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            rgba(31,50,66,.98),
            rgba(17,30,42,.99)
        );

    border:1px solid rgba(110,170,220,.18);

    box-shadow:
        0 18px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.045);
}

/* STATUS */

.status{
    color:#aab7c3;
    font-size:12px;
    margin-bottom:14px;
}

/* PROGRESS */

.progress{
    width:100%;
    height:7px;

    border-radius:20px;

    background:rgba(255,255,255,.07);

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:20px;

    background:#4a94d0;

    box-shadow:
        0 0 12px rgba(74,148,208,.45);

    transition:width .08s linear;
}

/* PERCENT */

.percent{
    margin-top:11px;

    color:#708292;
    font-size:10px;
}

/* CHECK */

.complete{
    display:none;

    margin-top:18px;

    color:#67b3e8;
    font-size:12px;
}

</style></head><body><div class="container"><div class="icon" id="icon">
    ⟳
</div>

<h1>Calculating your gift</h1>

<p class="subtitle">
    Please wait while we calculate your total amount.
</p>

<div class="amount">
    <span class="currency">RWF</span>
    <span id="amount">0</span>
</div>

<div class="card">

    <div class="status" id="status">
        Calculating...
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">
        0%
    </div>

    <div class="complete" id="complete">
        Calculation complete ✓
    </div>

</div>

</div><script>

const target = 315400;

const amountElement =
    document.getElementById("amount");

const progressBar =
    document.getElementById("progressBar");

const percentElement =
    document.getElementById("percent");

const statusElement =
    document.getElementById("status");

const completeElement =
    document.getElementById("complete");

const icon =
    document.getElementById("icon");

let current = 0;

const duration = 5000;
const startTime = performance.now();

function formatNumber(number){

    return Math.floor(number)
        .toLocaleString("en-US");

}

function animate(time){

    const elapsed = time - startTime;

    let progress =
        Math.min(elapsed / duration, 1);

    /*
       Smooth calculation animation
    */

    const eased =
        1 - Math.pow(1 - progress, 3);

    current = target * eased;

    const percent =
        Math.floor(progress * 100);

    amountElement.textContent =
        formatNumber(current);

    progressBar.style.width =
        percent + "%";

    percentElement.textContent =
        percent + "%";

    if(progress < 1){

        requestAnimationFrame(animate);

    }else{

        amountElement.textContent =
            formatNumber(target);

        progressBar.style.width = "100%";

        percentElement.textContent = "100%";

        statusElement.textContent =
            "Calculation complete";

        completeElement.style.display =
            "block";

        icon.textContent = "✓";
    }
}

requestAnimationFrame(animate);

</script></body>
</html>
